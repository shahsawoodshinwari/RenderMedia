name: Bearer Security Scan

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  schedule:
    - cron: '45 12 * * 0' # Runs every Sunday at 12:45 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bearer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Bearer Scan
        id: report
        uses: bearer/bearer-action@v2
        with:
          api-key: ${{ secrets.BEARER_TOKEN }}
          format: sarif
          output: results.sarif
          exit-code: 0 # Prevents the workflow from failing due to findings

      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          
